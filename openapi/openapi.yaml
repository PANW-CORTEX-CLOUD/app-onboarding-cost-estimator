openapi: 3.1.0
info:
  title: Cloud Connector Cost Estimator API
  version: 0.2.0
  description: |
    Contract-first REST for multi-cloud Cortex customer-infra cost estimates.
    Breaking changes bump `info.version` (package 15 EDGE).
    Handlers must not expose raw provider OData / price-list payloads.
servers:
  - url: /v1
tags:
  - name: health
  - name: capabilities
  - name: rates
  - name: estimates
  - name: projections
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness / model version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /capabilities:
    get:
      operationId: getCapabilities
      tags: [capabilities]
      summary: Capability → meter map for a provider
      parameters:
        - $ref: "#/components/parameters/ProviderParam"
      responses:
        "200":
          description: Capability meter rows (sanitized)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        "400":
          $ref: "#/components/responses/Problem"
  /rates:
    get:
      operationId: getRates
      tags: [rates]
      summary: Resolve rate card (sanitized unitPrices only)
      parameters:
        - $ref: "#/components/parameters/ProviderParam"
        - name: region
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Sanitized rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatesResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /rates/refresh:
    post:
      operationId: refreshRates
      tags: [rates]
      summary: Force live rate refresh (rate-limited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRatesRequest"
      responses:
        "200":
          description: Refreshed sanitized rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatesResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /estimates:
    post:
      operationId: createEstimate
      tags: [estimates]
      summary: Create monthly estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEstimateRequest"
      responses:
        "200":
          description: Estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /estimates/freeze:
    post:
      operationId: freezeEstimate
      tags: [estimates]
      summary: Freeze an estimate with its rate card pinned
      description: >-
        Re-runs the estimate server-side and pins the exact rate card it was
        priced with, so the returned payload reproduces the same total later
        even after live rates move. Fails closed when rates are critically
        stale unless ackCriticalStale is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreezeEstimateRequest"
      responses:
        "200":
          description: Frozen estimate export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrozenEstimateExport"
        "400":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /estimates/reload:
    post:
      operationId: reloadFrozenEstimate
      tags: [estimates]
      summary: Reload a previously frozen estimate
      description: >-
        Replays a frozen payload. A corrupt payload, a wrong schemaVersion, or
        a modelVersion the engine has moved past all fail closed with a named
        reason rather than silently re-pricing at today's rates. Reload does
        not re-run the estimator - inputHash is what detects tampering.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReloadFrozenEstimateRequest"
      responses:
        "200":
          description: Frozen payload plus any age warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReloadFrozenEstimateResponse"
        "400":
          $ref: "#/components/responses/Problem"
  /projections:
    post:
      operationId: createProjection
      tags: [projections]
      summary: Project monthly estimate forward (uses core projectCosts)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectionRequest"
      responses:
        "200":
          description: Projection series + table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    ProviderParam:
      name: provider
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/CloudProvider"
  schemas:
    CloudProvider:
      type: string
      enum: [azure, aws, gcp]
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, modelVersion, service, apiVersion]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        modelVersion:
          type: string
        service:
          type: string
        apiVersion:
          type: string
    CapabilityMeterRow:
      type: object
      additionalProperties: false
      required: [capability, meterId, confidence, sourceUrl]
      properties:
        capability:
          type: string
        meterId:
          type: string
        meterSku:
          type: string
        confidence:
          type: string
          enum: [High, Med, Low]
        sourceUrl:
          type: string
          format: uri
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [provider, capabilities]
      properties:
        provider:
          $ref: "#/components/schemas/CloudProvider"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityMeterRow"
    RatesResponse:
      type: object
      additionalProperties: false
      required: [provider, region, currency, unitPrices, ratesAsOf, ratesSource, ageDays, modelVersion]
      properties:
        provider:
          $ref: "#/components/schemas/CloudProvider"
        region:
          type: string
        currency:
          type: string
          enum: [USD]
        unitPrices:
          type: object
          additionalProperties:
            type: number
        ratesAsOf:
          type: string
          format: date-time
        ratesSource:
          type: string
          enum: [live, cache, fallback]
        ageDays:
          type: number
        modelVersion:
          type: string
        warnings:
          type: array
          items:
            type: string
        freshness:
          type: object
          additionalProperties: false
          properties:
            level:
              type: string
              enum: [fresh, warn, critical]
            banner:
              type: string
              nullable: true
            requiresAckBeforeExport:
              type: boolean
    RefreshRatesRequest:
      type: object
      additionalProperties: false
      required: [provider, region]
      properties:
        provider:
          $ref: "#/components/schemas/CloudProvider"
        region:
          type: string
          minLength: 1
          maxLength: 64
        forceLive:
          type: boolean
          default: true
    EstimateCapabilities:
      type: object
      additionalProperties: false
      properties:
        discovery:
          type: boolean
        auditLogs:
          type: boolean
        adsCloud:
          type: boolean
        adsOutpost:
          type: boolean
        dspm:
          type: boolean
        registry:
          type: boolean
        serverless:
          type: boolean
        egress:
          type: boolean
    EstimateVolume:
      type: object
      additionalProperties: false
      properties:
        accountCount:
          type: number
          minimum: 0
        monthlyActiveUsers:
          type: number
          minimum: 0
        logIntensity:
          type: string
          enum: [low, medium, high]
        ingressGBPerDay:
          type: number
          minimum: 0
        peakMBps:
          type: number
          minimum: 0
        peakEventsPerSec:
          type: number
          minimum: 0
        byoManagedStream:
          type: boolean
        avgStoredGB:
          type: number
          minimum: 0
        vmCount:
          type: number
          minimum: 0
        avgUsedDiskGB:
          type: number
          minimum: 0
        scansPerMonth:
          type: number
          minimum: 0
        dataEstateGB:
          type: number
          minimum: 0
        pctScanned:
          type: number
          minimum: 0
        imageCount:
          type: number
          minimum: 0
        avgImageGB:
          type: number
          minimum: 0
          description: >
            Average compressed container-image size in GB. Only affects the
            total for cross-region registry scanning (crossRegionPull=true),
            where the scan pulls images across a region boundary and pays
            egress; same-region pulls are $0 and this field is inert.
        crossRegionPull:
          type: boolean
          description: >
            Whether registry scanning pulls images across a region boundary.
            False/omitted → same-region, no egress, $0 pull. True → bill
            imageCount × avgImageGB × scansPerMonth on the provider egress meter.
        packageCount:
          type: number
          minimum: 0
        egressGB:
          type: number
          minimum: 0
        overrideStreamMetrics:
          type: boolean
          description: >
            When true, lock explicit ingress/peak fields. When false/omitted,
            derive stream volume from accountCount elasticities (fail-closed:
            UI defaults must not silently ignore account scale).
        assumedEventBytes:
          type: number
          description: >
            Average audit event size in bytes for GB→events conversion (Azure EH
            ingress). Must be > 0. Default 1024 in engine.
        avgObjectSizeMB:
          type: number
          exclusiveMinimum: 0
          description: >
            Average size of a scanned object, in MB. Object stores bill DSPM
            scanning per API call rather than per GB, so this is what converts
            an estate size into billable read and list operations. Must be > 0.
    CreateEstimateRequest:
      type: object
      additionalProperties: false
      required: [provider, region, capabilities]
      properties:
        provider:
          $ref: "#/components/schemas/CloudProvider"
        region:
          type: string
          minLength: 1
          maxLength: 64
        capabilities:
          $ref: "#/components/schemas/EstimateCapabilities"
        volume:
          $ref: "#/components/schemas/EstimateVolume"
        monthHours:
          type: number
        tfMode:
          $ref: "#/components/schemas/TfMode"
    TfMode:
      type: string
      description: >-
        as-deployed prices only what the connector Terraform creates, so the
        total is comparable to the customer's first invoice. what-if also
        prices capabilities that have no connector Terraform.
      enum: [as-deployed, what-if]
    MeterVerification:
      type: object
      additionalProperties: false
      description: >-
        Provenance for the rate behind a line item: whether the number was last
        seen in the vendor's own price list, and how long ago.
      required: [verdict, verifiedAt, ageDays, stale, trusted, sourceUrl]
      properties:
        verdict:
          type: string
          enum: [verified, mismatch, unsupported-meter, proxy, unverified]
        verifiedAt:
          type: string
          nullable: true
        ageDays:
          type: number
        stale:
          type: boolean
        trusted:
          type: boolean
          description: Safe to present as a vendor-published price.
        sourceUrl:
          type: string
    AppliedDefault:
      type: object
      additionalProperties: false
      description: >-
        A value the estimator substituted because the request supplied none.
        Lets a reader tell their own numbers from the tool's guesses.
      required: [field, label, value, kind, rationale]
      properties:
        field:
          type: string
          description: Request field the value stood in for.
        label:
          type: string
        value:
          oneOf:
            - type: number
            - type: string
            - type: boolean
        kind:
          type: string
          description: >-
            convention = a billing definition identical for everyone;
            assumption = a guess about this customer's estate that changes the quote.
          enum: [convention, assumption]
        rationale:
          type: string
    ExcludedCapability:
      type: object
      additionalProperties: false
      required: [capability, reason]
      properties:
        capability:
          type: string
        reason:
          type: string
    LineItem:
      type: object
      additionalProperties: false
      required: [provider, capability, meterId, amount, confidence]
      properties:
        provider:
          $ref: "#/components/schemas/CloudProvider"
        capability:
          type: string
        meterId:
          type: string
        amount:
          type: number
        confidence:
          type: string
          enum: [High, Med, Low]
        verification:
          $ref: "#/components/schemas/MeterVerification"
    FreezeEstimateRequest:
      type: object
      additionalProperties: false
      required: [provider, region, capabilities]
      description: >-
        Same inputs as CreateEstimateRequest - the server re-runs the estimate
        rather than trusting a client to echo back totals it could have edited.
      properties:
        provider:
          $ref: "#/components/schemas/CloudProvider"
        region:
          type: string
          minLength: 1
          maxLength: 64
        capabilities:
          $ref: "#/components/schemas/EstimateCapabilities"
        volume:
          $ref: "#/components/schemas/EstimateVolume"
        monthHours:
          type: number
        tfMode:
          $ref: "#/components/schemas/TfMode"
        ackCriticalStale:
          type: boolean
          description: >-
            Required when rates are critically stale; without it the freeze
            fails closed rather than pinning prices nobody acknowledged.
    PinnedRateCard:
      type: object
      additionalProperties: false
      required: [provider, region, currency, unitPrices, capturedAt]
      description: The rate card the frozen estimate was priced with.
      properties:
        provider:
          $ref: "#/components/schemas/CloudProvider"
        region:
          type: string
        currency:
          type: string
          enum: [USD]
        unitPrices:
          type: object
          additionalProperties:
            type: number
        unitTiers:
          type: object
          description: >-
            Published price ladders, pinned alongside unitPrices. A graduated
            meter reloaded without its ladder would re-price flat at the first
            band and not reproduce the frozen total.
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [fromUnits, unitPrice]
              properties:
                fromUnits:
                  type: number
                unitPrice:
                  type: number
        capturedAt:
          type: string
          format: date-time
    FrozenEstimateExport:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - provider
        - modelVersion
        - ratesAsOf
        - inputHash
        - rateCard
        - inputs
        - lineItems
        - totals
        - confidence
        - disclaimer
        - frozenAt
        - warnings
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        provider:
          $ref: "#/components/schemas/CloudProvider"
        modelVersion:
          type: string
        ratesAsOf:
          type: string
          format: date-time
        inputHash:
          type: string
        rateCard:
          $ref: "#/components/schemas/PinnedRateCard"
        inputs:
          type: object
          description: The estimate inputs this quote was frozen from.
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        totals:
          type: object
          additionalProperties: false
          required: [expected]
          properties:
            expected:
              type: number
            low:
              type: number
            high:
              type: number
        confidence:
          type: string
          enum: [High, Med, Low]
        disclaimer:
          type: string
        frozenAt:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
    ReloadFrozenEstimateRequest:
      type: object
      additionalProperties: false
      required: [payload]
      properties:
        payload:
          description: >-
            A previously frozen export. Validated by the engine's own
            validateExportSchema rather than re-declared here, so the contract
            has one owner.
        requireCurrentModelVersion:
          type: boolean
    ReloadFrozenEstimateResponse:
      type: object
      additionalProperties: false
      required: [payload, warnings]
      properties:
        payload:
          $ref: "#/components/schemas/FrozenEstimateExport"
        warnings:
          type: array
          items:
            type: string
    EstimateResponse:
      type: object
      additionalProperties: false
      required:
        - provider
        - lineItems
        - totals
        - confidence
        - modelVersion
        - ratesAsOf
        - inputHash
      properties:
        provider:
          $ref: "#/components/schemas/CloudProvider"
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        totals:
          type: object
          additionalProperties: false
          required: [expected]
          properties:
            expected:
              type: number
            low:
              type: number
            high:
              type: number
        confidence:
          type: string
          enum: [High, Med, Low]
        modelVersion:
          type: string
        ratesAsOf:
          type: string
        inputHash:
          type: string
        ratesSource:
          type: string
          enum: [live, cache, fallback]
        warnings:
          type: array
          items:
            type: string
        tfMode:
          $ref: "#/components/schemas/TfMode"
        excludedCapabilities:
          type: array
          description: Capabilities dropped because the Terraform will not deploy them.
          items:
            $ref: "#/components/schemas/ExcludedCapability"
        appliedDefaults:
          type: array
          description: Defaults the estimator substituted for absent inputs.
          items:
            $ref: "#/components/schemas/AppliedDefault"
        resolvedVolume:
          type: object
          additionalProperties: false
          required:
            - ingressGBPerDay
            - peakMBps
            - peakEventsPerSec
            - overrideStreamMetrics
          properties:
            ingressGBPerDay:
              type: number
            peakMBps:
              type: number
            peakEventsPerSec:
              type: number
            overrideStreamMetrics:
              type: boolean
    CreateProjectionRequest:
      type: object
      additionalProperties: false
      required: [monthlyExpected, months]
      properties:
        monthlyExpected:
          type: number
          minimum: 0
        months:
          type: integer
          minimum: 1
          # Mirrors packages/cost-engine/src/core/project-costs.ts
          # PROJECTION_MAX_MONTHS - the canonical value the API's zod schema
          # (packages/api/src/schemas.ts) validates against. YAML can't import
          # a TS constant, so this is a manually-kept-in-sync literal.
          maximum: 36
          description: Horizon 1–36 months (default 12 in UI)
        annualGrowthPercent:
          type: number
          description: >
            Annual volume growth percent. Negative values floored at 0.
            0 → flat series equal to monthly estimate. Growth applies to
            volumeElastic meters; TU/Kinesis/PubSub use step functions.
        provider:
          $ref: "#/components/schemas/CloudProvider"
        monthlyLow:
          type: number
          minimum: 0
          description: Optional low band for Low-confidence envelope
        monthlyHigh:
          type: number
          minimum: 0
          description: Optional high band for Low-confidence envelope
        lineItems:
          type: array
          description: Estimate line items for stacked run-rate (same meters as createEstimate)
          # Mirrors packages/cost-engine/src/core/project-costs.ts
          # PROJECTION_MAX_LINE_ITEMS. projectCosts builds months × lineItems
          # objects, so an uncapped array is a CPU/memory amplification vector.
          maxItems: 200
          items:
            $ref: "#/components/schemas/ProjectionLineItem"
    ProjectionLineItem:
      type: object
      additionalProperties: false
      required: [provider, capability, meterId, amount, confidence]
      properties:
        provider:
          type: string
        capability:
          type: string
        meterId:
          type: string
        amount:
          type: number
          minimum: 0
        confidence:
          type: string
          enum: [High, Med, Low]
        volumeElastic:
          type: boolean
    ProjectionStackSlice:
      type: object
      additionalProperties: false
      required: [provider, capability, meterId, amount, confidence]
      properties:
        provider:
          type: string
        capability:
          type: string
        meterId:
          type: string
        amount:
          type: number
        confidence:
          type: string
    ProjectionPoint:
      type: object
      additionalProperties: false
      required: [month, expected, cumulative, volumeIndex]
      properties:
        month:
          type: integer
        expected:
          type: number
        cumulative:
          type: number
          description: Cumulative TCO through this month
        volumeIndex:
          type: number
          description: Volume growth overlay index (1.0 at month 1)
        low:
          type: number
        high:
          type: number
        stacks:
          type: array
          items:
            $ref: "#/components/schemas/ProjectionStackSlice"
    ProjectionResponse:
      type: object
      additionalProperties: false
      required:
        - series
        - table
        - total
        - monthlyBaseline
        - annualGrowthPercent
        - modelVersion
        - disclaimer
      properties:
        series:
          type: array
          items:
            $ref: "#/components/schemas/ProjectionPoint"
        table:
          type: array
          items:
            $ref: "#/components/schemas/ProjectionPoint"
        total:
          type: number
        monthlyBaseline:
          type: number
        annualGrowthPercent:
          type: number
        modelVersion:
          type: string
        provider:
          $ref: "#/components/schemas/CloudProvider"
        disclaimer:
          type: string
          description: Must not imply reserved/CUD pricing
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
  responses:
    Problem:
      description: RFC 7807 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

name: claude-skills-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer tests
        run: node --test 'tools/skill-installer/tests/*.test.mjs'
      - name: Skill tests
        run: |
          for dir in skills/*/tests; do
            echo "::group::${dir}"
            node --test "${dir}/*.test.mjs"
            echo "::endgroup::"
          done

# Continuous integration for the cloud-connector monorepo.
#
# Why this file exists
# --------------------
# The repository already carries an elaborate *offline* gate suite — boundary
# and circular-dependency checks, OpenAPI drift, Terraform-honesty drift, the
# price-validation ledger, the estimate CLI, Spectral, four Vitest projects and
# a Playwright end-to-end pass — all wired behind a single `pnpm test`. Several
# docs (ARCHITECTURE.md, NEXT_STEPS.md, IMPROVEMENT_PLAN.md) already speak of
# "CI" as the thing that enforces those invariants, but until this workflow
# there was no CI: the gates only ran when a developer remembered to run them
# locally. That is the same "a check that is not enforced is not a check"
# failure mode the gate scripts themselves guard against, one layer up. This
# workflow closes that gap by running the exact same `pnpm test` on every push
# to `main` and every pull request, so a drift or regression fails loudly in
# the open instead of silently landing.
#
# Design notes
# ------------
# * pnpm version is NOT pinned here — `pnpm/action-setup` reads the
#   `packageManager: "pnpm@9.15.0"` field in the root package.json, keeping a
#   single source of truth. Bump it there, not here.
# * `--frozen-lockfile` makes an out-of-date `pnpm-lock.yaml` a hard failure
#   rather than silently resolving a different tree than the one committed.
# * The package `build` scripts are all `tsc --noEmit` (the runtime executes
#   TypeScript directly via `--experimental-strip-types`), so the typecheck
#   step below is a pure type gate, not an artifact build.
# * Playwright's browser is installed explicitly. The repo's playwright.config
#   prefers a sandbox-provided `/opt/pw-browsers/chromium` when present and
#   falls back to Playwright's own resolution otherwise; on a stock GitHub
#   runner that path is absent, so the browser must be installed here.
# * GitHub Actions sets `CI=true`, which flips playwright.config's
#   `reuseExistingServer` off so the e2e job always boots fresh API + web
#   servers instead of reusing a stale one.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a rapid push train doesn't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: gates + typecheck + tests + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must precede setup-node so that `cache: pnpm` can find the pnpm binary.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type gate across every workspace (engine, api, web) — `tsc --noEmit`.
      - name: Typecheck
        run: pnpm build

      # Install only the Chromium build Playwright expects, plus its OS deps.
      - name: Install Playwright browser
        run: pnpm --filter @cloud-connector/web exec playwright install --with-deps chromium

      # The full offline gate suite + all four Vitest projects + Playwright e2e.
      - name: Run gates and tests
        run: pnpm test
